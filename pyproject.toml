[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codegenome"
dynamic = ["version"]
description = "Open-source CLI for building and querying local codebase knowledge graphs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [{ name = "CodeGenome Contributors" }]
keywords = ["code-analysis", "knowledge-graph", "mcp", "cli", "tree-sitter"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "tree-sitter>=0.23,<0.26",
  "tree-sitter-python>=0.23,<0.26",
  "tree-sitter-javascript>=0.23,<0.26",
  "tree-sitter-typescript>=0.23,<0.26",
  "tree-sitter-go>=0.23,<0.26",
  "tree-sitter-rust>=0.23,<0.26",
  "watchdog>=4,<7",
  "fastmcp>=3.2,<4",
  "mcp>=1.28.1,<2",
  "leidenalg>=0.10,<0.13",
  "python-igraph>=0.11,<1.1",
  "click>=8.1,<9",
  "jinja2>=3.1,<4",
  "websockets>=12,<17",
  "textual>=0.50,<9",
  "networkx>=3.2,<4",
  "pathspec>=0.12,<2",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.4,<1",
  "pyinstaller>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/Ogro-Projukti/codegenome"
Documentation = "https://github.com/Ogro-Projukti/codegenome/tree/main/docs"
Repository = "https://github.com/Ogro-Projukti/codegenome"
Issues = "https://github.com/Ogro-Projukti/codegenome/issues"

[project.scripts]
codegenome = "codegenome.cli:cli"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "codegenome.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codegenome = [
  "py.typed",
  "assets/**/*",
  "templates/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
