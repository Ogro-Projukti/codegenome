<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeGenome &middot; Karyotype</title>
  <link rel="stylesheet" href="karyotype.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="helix">&#129516;</span>
      <div class="brand-text">
        <h1>Karyotype</h1>
        <p id="workspace-label">CodeGenome</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span id="stat-communities">0</span><label>Chromosomes</label></div>
      <div class="stat"><span id="stat-modules">0</span><label>Modules</label></div>
      <div class="stat"><span id="stat-genes">0</span><label>Genes</label></div>
      <div class="stat"><span id="stat-snapshot">&mdash;</span><label>Snapshot</label></div>
    </div>
    <div id="live-badge" class="live-badge offline" title="Real-time connection status">
      <span class="dot"></span><span class="live-text">Offline</span>
    </div>
  </header>

  <nav class="breadcrumb" id="breadcrumb">
    <button type="button" id="crumb-root" class="crumb">Genome</button>
  </nav>

  <main id="grid" class="grid" aria-live="polite"></main>

  <div id="empty-state" class="empty-state hidden">
    <p>No genome data yet. Run <code>codegenome analyze</code> or start <code>codegenome evolve --live</code>.</p>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="karyotype.js"></script>
</body>
</html>
