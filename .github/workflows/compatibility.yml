name: Cross-platform quality gate

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: "Dependency vulnerability audit / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pip-audit==2.10.1

      - name: Audit clean installed environment
        run: python -m pip_audit --progress-spinner off

  full-tests:
    name: "Full tests / ${{ matrix.os }} / py${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade build tooling
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install package and test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the complete test suite
        run: python -m pytest -q

      - name: CLI smoke test
        run: |
          codegenome --help
          codegenome doctor --help
          python -c "import codegenome; print(codegenome.__version__)"

  quality:
    name: Lint, coverage, and package build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project quality tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine
          python -m pip install -r requirements.txt

      - name: Ruff
        run: python -m ruff check src tests

      - name: Coverage floor
        run: python -m pytest --cov=codegenome --cov-report=term-missing --cov-fail-under=65

      - name: Build source and wheel distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Test the installed wheel outside the source tree
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          package_test_dir="$(mktemp -d)"
          cd "$package_test_dir"
          python -m codegenome --help
          python -c "from importlib.resources import files; assert files('codegenome').joinpath('py.typed').is_file()"
