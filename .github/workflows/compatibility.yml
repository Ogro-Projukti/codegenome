name: Cross-platform quality gate

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install audit tooling
        run: python -m pip install pip-audit==2.10.1

      - name: Audit constrained project resolution
        run: python -m pip_audit -r requirements.txt --progress-spinner off

  full-tests:
    name: "Full tests / ${{ matrix.os }} / py${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade build tooling
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install package and test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the complete test suite
        run: python -m pytest -q

      - name: CLI smoke test
        run: |
          codegenome --help
          python -c "import codegenome; print(codegenome.__version__)"

  quality:
    name: Lint, coverage, and package build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project quality tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install -r requirements.txt

      - name: Ruff
        run: python -m ruff check src tests

      - name: Coverage floor
        run: python -m pytest --cov=codegenome --cov-report=term-missing --cov-fail-under=65

      - name: Build source and wheel distributions
        run: python -m build
